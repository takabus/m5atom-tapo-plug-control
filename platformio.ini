[common]
build_flags =
    -DCORE_DEBUG_LEVEL=3
; WiFi / Tapo credentials are injected by scripts/load_env.py from .env
extra_scripts = pre:scripts/load_env.py

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0
build_flags = ${common.build_flags}
extra_scripts = ${common.extra_scripts}

[env:esp8266mod]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags = ${common.build_flags}
extra_scripts = ${common.extra_scripts}
