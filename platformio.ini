[common]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -DTAPO_IP=\"${sysenv.TAPO_IP}\"
    -DTAPO_EMAIL=\"${sysenv.TAPO_EMAIL}\"
    -DTAPO_PASSWORD=\"${sysenv.TAPO_PASSWORD}\"

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0
build_flags = ${common.build_flags}

[env:esp8266mod]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags = ${common.build_flags}
